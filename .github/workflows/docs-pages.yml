name: Fork documentation Pages

on:
  push:
    branches: [foundation/rust-bdd-sdk]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GQAdonis/gherkin' && github.ref == 'refs/heads/foundation/rust-bdd-sdk'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install pinned documentation dependencies
        run: npm ci --no-audit --no-fund
      - name: Build documentation (broken links fail the deployment)
        run: npm run build
        env:
          DOCS_URL: https://gqadonis.github.io
          DOCS_BASE_URL: /gherkin/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the successful documentation artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
